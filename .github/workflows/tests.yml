name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck -S warning install.sh template/scripts/docs-check.sh template/scripts/recall.sh template/scripts/state-prune.sh template/scripts/load-context.sh scripts/recall.sh scripts/state-prune.sh scripts/load-context.sh tests/run.sh tests/recall.sh tests/state-prune.sh tests/load-context.sh tests/link-fixtures.sh
      - name: tests
        run: bash tests/run.sh

  # The guard is bash, and half the point is that it survives a Windows
  # teammate. Git Bash is the environment they actually have.
  guard-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: context path safety
        run: |
          bash tests/recall.sh
          bash tests/state-prune.sh
      - run: bash tests/run.sh
