name: docs

# The rule guard. Runs for ANYONE who pushes -- human, Claude, Codex, any tool.
# Local hooks only apply to the tool that installed them; this is the one layer
# that cannot be bypassed by switching tools.
#
# The rules themselves live in docs/AGENT-PROTOCOL.md. If a rule matters but
# cannot be checked here, that rule depends on goodwill.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A first branch push has no earlier branch snapshot. State that limit.
      # Other invalid bases are passed through and FAIL in the guard.
      - name: Resolve comparison commit
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ref="$PR_BASE"
          else
            ref="$PUSH_BASE"
          fi
          if [ "$EVENT_NAME" = push ] && [ "$ref" = 0000000000000000000000000000000000000000 ]; then
            echo "::notice::First branch push: checkout structure only; no previous branch snapshot for session evidence."
            ref=HEAD
          fi
          [ -n "$ref" ] || { echo "::error::Missing comparison base"; exit 1; }
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: docs-check
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: bash scripts/docs-check.sh

  # The guard carries a tripwire for a handful of high-confidence secret shapes.
  # This is the real scanner. Keep both: the tripwire fails fast on a laptop,
  # this one knows about the other four hundred formats.
  #
  # If your repository tests a secret detector, this job will flag your fixtures
  # the first time it runs -- they are credential-shaped on purpose. That is not
  # a false positive so much as a scanner being right about the shape and wrong
  # about the intent. Allowlist the file, not the finding: a `.gitleaks.toml`
  # naming the path survives every edit to it, where a pinned fingerprint does
  # not. Fragment's own repository does exactly this for `tests/run.sh`.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
