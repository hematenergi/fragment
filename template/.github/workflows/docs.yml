name: docs

# The rule guard. Runs for ANYONE who pushes -- human, Claude, Codex, any tool.
# Local hooks only apply to the tool that installed them; this is the one layer
# that cannot be bypassed by switching tools.
#
# The rules themselves live in docs/AGENT-PROTOCOL.md. If a rule matters but
# cannot be checked here, that rule depends on goodwill.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # github.event.before is the all-zero SHA on the first push to a branch,
      # and a force-push can leave it pointing at a commit that no longer
      # exists. Resolve to something real, or to nothing at all.
      - name: Resolve comparison commit
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ref="${{ github.event.pull_request.base.sha }}"
          else
            ref="${{ github.event.before }}"
          fi
          if ! git rev-parse --verify -q "${ref}^{commit}" >/dev/null 2>&1; then
            ref="$(git rev-parse --verify -q HEAD~1 || true)"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: docs-check
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: bash scripts/docs-check.sh

  # The guard carries a tripwire for a handful of high-confidence secret shapes.
  # This is the real scanner. Keep both: the tripwire fails fast on a laptop,
  # this one knows about the other four hundred formats.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
